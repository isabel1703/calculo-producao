<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Conferência de Produção por Palets</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #e6d9f2, #cbb6e8);
  padding: 20px;
}

.container {
  background: #fff;
  max-width: 560px;
  margin: auto;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 0 10px rgba(74, 20, 140, 0.3);
}

h2 {
  text-align: center;
  color: #4a148c;
}

label {
  display: block;
  margin-top: 10px;
  font-weight: bold;
  color: #4a148c;
}

input, select, button {
  width: 100%;
  padding: 8px;
  margin-top: 5px;
}

button {
  background: #4a148c;
  color: #fff;
  border: none;
  margin-top: 15px;
  font-size: 16px;
  border-radius: 6px;
  cursor: pointer;
}

.resultado {
  margin-top: 20px;
  padding: 12px;
  border-radius: 6px;
  font-weight: bold;
}

.ok { background: #e8f5e9; color: #2e7d32; }
.faltou { background: #fff3e0; color: #ef6c00; }
.passou { background: #fdecea; color: #c62828; }
</style>
</head>

<body>

<div class="container">
<h2>Conferência de Produção</h2>

<label>ML da garrafa</label>
<select id="ml">
  <option value="">Selecione</option>
  <option value="200">200ml</option>
  <option value="250">250ml</option>
  <option value="350">350ml</option>
  <option value="510">510ml</option>
  <option value="2L">2L</option>
  <option value="2LCP">2L CP</option>
  <option value="5L">5L</option>
</select>

<label>Produção</label>
<input type="number" id="producao">

<label>Palets</label>
<input type="number" id="palets">

<label>Fardos Avulsos</label>
<input type="number" id="fardos">

<label>Garrafas avulsas</label>
<input type="number" id="avulsas">

<label>Garrafas do estoque</label>
<input type="number" id="estoque">

<label>Garrafas do turno anterior</label>
<input type="number" id="turno">

<label>Perda de garrafas</label>
<input type="number" id="perda">

<button onclick="calcular()">Calcular</button>

<div id="resultado" class="resultado"></div>
</div>

<script>
function dadosGarrafa(ml) {
  const tabela = {
    "200": { fardo: 450, palet: 14 },
    "250": { fardo: 406, palet: 12 },
    "350": { fardo: 325, palet: 12 },
    "510": { fardo: 253, palet: 12 },
    "2L": { fardo: 140, palet: 8 },
    "2LCP": { fardo: 120, palet: 9 },
    "5L": { fardo: 49, palet: 8 }
  };
  return tabela[ml];
}

function calcular() {
  const ml = document.getElementById("ml").value;
  const cfg = dadosGarrafa(ml);

  if (!cfg) {
    alert("Selecione o ML da garrafa");
    return;
  }

  const producao = Number(document.getElementById("producao").value);
  const palets = Number(document.getElementById("palets").value);
  const fardos = Number(document.getElementById("fardos").value);
  const avulsas = Number(document.getElementById("avulsas").value);
  const estoque = Number(document.getElementById("estoque").value);
  const turno = Number(document.getElementById("turno").value);
  const perda = Number(document.getElementById("perda").value);

  const totalPalets = palets * cfg.palet * cfg.fardo;
  const totalFardos = fardos * cfg.fardo;

  const totalCalculado =
    totalPalets +
    totalFardos +
    avulsas +
    perda -
    estoque -
    turno;

  const diferenca = producao - totalCalculado;
  const res = document.getElementById("resultado");

  if (diferenca === 0) {
    res.className = "resultado ok";
    res.innerHTML = `
      ✅ BATEU COM A PRODUÇÃO<br>
      Total calculado: ${totalCalculado}
    `;
  } else if (diferenca > 0) {
    res.className = "resultado faltou";
    res.innerHTML = `
      ⚠️ FALTOU PRODUÇÃO<br>
      Diferença: ${diferenca} garrafas
    `;
  } else {
    res.className = "resultado passou";
    res.innerHTML = `
      ❌ PASSOU DA PRODUÇÃO<br>
      Diferença: ${Math.abs(diferenca)} garrafas
    `;
  }
}
</script>

</body>
</html>
